name: CI - Build Scan & Push Finote Frontend Image

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read VERSION
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Set image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}/finote-frontend" >> $GITHUB_ENV

      # Branch-aware config
      - name: Set environment config
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "VITE_MODE=production" >> $GITHUB_ENV
          echo "VITE_API_URL=${{ vars.VITE_API_URL_PROD }}" >> $GITHUB_ENV
          echo "VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE_PROD }}" >> $GITHUB_ENV

          echo "IMAGE_TAGS<<EOF" >> $GITHUB_ENV
          echo "${IMAGE_NAME}:${VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      # Build (no push)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          no-cache: true
          build-args: |
            VITE_MODE=${{ env.VITE_MODE }}
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_AUTH_MODE=${{ env.VITE_AUTH_MODE }}

      # Image Security scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          exit-code: 1

      # Login GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      #  Push iamges
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_MODE=${{ env.VITE_MODE }}
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_AUTH_MODE=${{ env.VITE_AUTH_MODE }}
